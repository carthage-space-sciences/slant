   square corners, no shadows, no badges; items are rows that fold open in place. One light theme: the site is

:root {
  --ink: #003C4B;
  --muted: #4D6F78;
  --red: #D0202E;
  --link: #00607A;
  --rule: #A6D3DD;
  --wash: #F4F8FA;
  --paper: #FFFFFF;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Source Sans 3", "Gill Sans", Calibri, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; border-radius: 0; }
[hidden] { display: none !important; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.65; margin: 0; }
.wrap { max-width: 70rem; margin: 0 auto; padding-inline: 20px; }
.prose { max-width: 46rem; }
a { color: var(--link); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { color: var(--ink); }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
.small { font-size: 14px; line-height: 1.5; color: var(--muted); }
.label { font-family: var(--sans); font-size: 14px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink); }
button.textbtn { font: inherit; font-size: 14px; line-height: 1.5; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
button.textbtn:hover { color: var(--ink); }
button.textbtn:disabled { color: var(--muted); text-decoration: none; cursor: default; }

/* header */
header.site { padding-block: 26px 14px; }
.head-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 32px; }
.wordmark { font-family: var(--sans); font-size: 28px; line-height: 1.1; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.expansion { margin-top: 4px; }
.notice { margin-top: 10px; }

/* tab bar */
nav.tabs { border-bottom: 1px solid var(--rule); background: var(--paper); }
.tablist { display: flex; gap: 26px; overflow-x: auto; scrollbar-width: thin; }
.tablist button { font: inherit; font-size: 14px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 0 11px; white-space: nowrap; cursor: pointer; }
.tablist button:hover { color: var(--ink); }
.tablist button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

main { padding-block: 44px 64px; }
section.tab { display: grid; gap: 56px; }

/* page opening */
.page-head { display: grid; gap: 14px; }
.page-head::before { content: ""; width: 40px; height: 3px; background: var(--red); }
.page-head h1 { font-family: var(--serif); font-size: 40px; line-height: 1.15; font-weight: 400; }
.question { font-family: var(--serif); font-size: 22px; line-height: 1.35; }
.page-head .intro { margin-top: 4px; }

/* sections */
.sec { display: grid; gap: 6px; min-width: 0; }
.sec > .small { margin-block: 6px 4px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; border-bottom: 1px solid var(--ink); padding-bottom: 8px; }
.sec-head .ctl { display: flex; gap: 8px; align-items: baseline; }
.sec-head .ctl span { color: var(--muted); font-size: 14px; }

/* claims list, the one tinted band on a tab */
.band { background: var(--wash); padding: 28px 28px 30px; display: grid; gap: 14px; }
@media (max-width: 600px) { .band { padding: 22px 16px; margin-inline: -16px; } }
.claims { list-style: none; margin: 0; padding: 0; counter-reset: claim; display: grid; }
.claims li { counter-increment: claim; display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); padding-block: 14px; border-top: 1px solid var(--rule); }
.claims li:first-child { border-top: 0; padding-top: 4px; }
.claims li::before { content: counter(claim); font-family: var(--serif); font-size: 20px; line-height: 1.3; }
.claim-text { max-width: 46rem; }
.claim-meta { grid-column: 2; margin-top: 4px; }
.claim-meta a { color: var(--link); }

/* rows that fold */
.rows { display: grid; }
details.row { border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
details.row > summary { list-style: none; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding-block: 14px; cursor: pointer; }
details.row > summary::-webkit-details-marker { display: none; }
details.row > summary::before { content: "+"; font-family: var(--sans); font-size: 20px; line-height: 1; color: var(--link); }
details.row[open] > summary::before { content: "\2212"; }
.row-title { font-family: var(--serif); font-size: 20px; line-height: 1.3; font-weight: 400; }
details.row > summary:hover .row-title { color: var(--link); }
.row-meta { white-space: nowrap; }
@media (max-width: 640px) { details.row > summary { grid-template-columns: 1.6rem minmax(0, 1fr); } .row-meta { grid-column: 2; white-space: normal; } }
.row-body { padding: 4px 0 26px 1.6rem; display: grid; gap: 14px; min-width: 0; }
@media (max-width: 640px) { .row-body { padding-left: 0; } }
details.row.arrived { background: var(--wash); }
.fig { margin: 0; display: grid; gap: 8px; justify-items: start; }
.fig button { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 100%; }
.fig img { display: block; max-width: 100%; max-height: 560px; height: auto; }
.fig img.edge { border: 1px solid var(--rule); }
.fig.page img { max-height: 420px; border: 1px solid var(--rule); }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 15px; }
.refs { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; font-size: 15px; max-width: 46rem; }
.refs .what { display: block; color: var(--muted); font-size: 14px; }
.reflist { list-style: none; padding-left: 0; }
.reflist li { display: grid; grid-template-columns: 2.6rem minmax(0, 1fr); }
.reflist .rn { color: var(--muted); font-variant-numeric: tabular-nums; }
.reflist a { color: var(--link); overflow-wrap: anywhere; }
.files .sz { color: var(--muted); }

/* tables */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table { border-collapse: collapse; font-size: 15px; line-height: 1.45; width: 100%; }
th { text-align: left; font-weight: 700; padding: 6px 14px 6px 0; border-bottom: 1px solid var(--ink); vertical-align: bottom; }
td { padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plain { min-width: 560px; }
table.plain.money td.c1, table.plain.money td.c2:not(:last-child), table.plain.money th:nth-child(2), table.plain.money th:nth-child(3):not(:last-child) { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.plain.power td:not(.c0) { font-variant-numeric: tabular-nums; white-space: nowrap; }
table.plain tr.sum td { font-weight: 700; border-top: 1px solid var(--ink); }
.bom-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.bom-tools input { font: inherit; font-size: 15px; padding: 6px 8px; border: 1px solid var(--muted); background: var(--paper); color: var(--ink); min-width: 0; flex: 1 1 16rem; max-width: 24rem; }
.bom-wrap { overflow: auto; max-height: 70vh; }
table.bom { min-width: 1080px; font-size: 14px; }
table.bom th { position: sticky; top: 0; background: var(--paper); white-space: nowrap; }
table.bom td.c4 { min-width: 22rem; color: var(--muted); }
table.bom td.c3, table.bom td.c5, table.bom td.c7 { overflow-wrap: anywhere; min-width: 8rem; }

/* page viewer */
.pv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pv-list { margin: 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.4; display: flex; flex-wrap: wrap; gap: 6px 22px; }
.pv-list button { font: inherit; text-align: left; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); }
.pv-list button .lbl { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
.pv-list button .n { color: var(--muted); }
.pv-list button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.pv-list button[aria-pressed="true"] .lbl { text-decoration: none; }
.pv-main { display: grid; gap: 8px; min-width: 0; }
.pv-tools { display: flex; gap: 14px; }
.pv-stage { position: relative; aspect-ratio: 1.414 / 1; max-width: 100%; background: #FFFFFF; border: 1px solid var(--rule); overflow: hidden; touch-action: none; cursor: grab; }
.pv-stage.drag { cursor: grabbing; }
.pv-stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; }

/* 3D viewer */
.stage { position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 52rem; background: #FFFFFF; border: 1px solid var(--rule); overflow: hidden; touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 18px; }
.picked { position: absolute; left: 10px; top: 8px; font-size: 14px; background: rgba(255,255,255,0.92); padding: 2px 6px; }
.status { position: absolute; left: 10px; bottom: 8px; font-size: 14px; color: var(--muted); background: rgba(255,255,255,0.92); padding: 2px 6px; }
.vbar { display: flex; flex-wrap: wrap; gap: 6px 18px; }

/* start page */
.lead { font-size: 20px; line-height: 1.55; }
.index { list-style: none; margin: 0; padding: 0; display: grid; }
.index li { display: grid; grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); gap: 4px 24px; padding-block: 12px; border-top: 1px solid var(--rule); }
.index li:first-child { border-top: 0; padding-top: 2px; }
.index a { font-family: var(--serif); font-size: 20px; line-height: 1.3; }
@media (max-width: 700px) { .index li { grid-template-columns: minmax(0, 1fr); } }
.key { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 24px; margin: 0; font-size: 15px; }
.key dt { font-weight: 400; }
.key dd { margin: 0; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 20px; }
.strip figure { margin: 0; display: grid; gap: 6px; align-content: start; }
.strip button { padding: 0; border: 1px solid var(--rule); background: #FFFFFF; cursor: zoom-in; display: block; }
.strip img { display: block; width: 100%; aspect-ratio: 11 / 8.5; object-fit: contain; }
.plainlist { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

footer.site { border-top: 1px solid var(--rule); padding-block: 18px 34px; }
footer.site .wrap { display: grid; gap: 2px; }

/* enlarged view */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(0, 30, 38, 0.9); display: grid; place-items: center; padding: 24px 16px; }
.lb-inner { max-width: min(1400px, 96vw); display: grid; gap: 10px; justify-items: center; }
.lb img, .lb video { max-width: 100%; max-height: 82vh; background: #FFFFFF; display: block; }
.lb-cap { color: #FFFFFF; font-size: 15px; text-align: center; max-width: 70ch; }
.lb-close { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; font: inherit; font-size: 15px; color: #FFFFFF; background: none; border: 0; text-decoration: underline; cursor: pointer; }
</style>

led"], ["Vertical resolution (median averaging-kernel width) is 10.0 km quiet, 10.5 km in a storm.", ["M02", "M03"], "modeled"], ["At 200 km, half the mass along a ray lies in a 5.7° arc (6.5° in a storm), wider than the 5° benchmark.", ["M02"], "modeled"], ["A unit records about 10 profiles daily, most near the evening terminator.", ["C_RATE"], "modeled"], ["On a visible-light bench matching the flight blur-to-slit ratio, the ratio method recovered calibrated optical depths of 0.6 to 2.25 within 0.01 (acceptance 0.02).", ["T_A5", "T_TESTS", "T_MATCH"], "measured"], ["Each reading is divided by a same-slit reference taken with the Sun 10° above the host's horizon, so gain and throughput cancel.", ["P_REQ"], "design"], ["With reference-ray absorption modeled, hosts from 350 km pass the same simulated tests.", ["P_REQ"], "modeled"], ["Out-of-band leak is measured below 105 km, where the EUV channels are opaque.", ["P_REQ"], "design"], ["Bench scans measure each assembly's angular response to 0.27%, holding the oxygen bias within 3.3%.", ["P_REQ", "T_CAL"], "planned"], ["NIST SURF III measures the engineering unit's 5–175 nm response against the retrieval's model, and indium's out-of-band transmission to ±2%; flight films share that Luxel run.", ["P_REQ", "T_CAL"], "planned"]], "sections": [{"title": "Measurement", "ids": ["M01", "M04", "M05", "M06", "M07"], "kind": "cards", "note": ""}, {"title": "Performance", "ids": ["M02", "M03"], "kind": "cards", "note": ""}, {"title": "Calibration", "ids": ["P_REQ"], "kind": "table", "note": ""}, {"title": "Bias and total error", "ids": ["P_ACC"], "kind": "table", "note": ""}, {"title": "Tutorials", "ids": ["T_u01", "T_u02", "T_u03", "T_u04", "T_u05", "T_u06", "T_u07", "T_u08", "T_u10"], "kind": "units", "note": "A course developed to guide new members of the project team and introduce the key principles of the approach, from why density matters to which channels to fly. Each unit is a chapter with a Jupyter notebook that runs the project's simulator. Where a unit's figure differs from the proposal's, the proposal and Figure 2 govern."}], "tutorial_note": "A course developed to guide new members of the project team and introduce the key principles of the approach, from why density matters to which channels to fly. Each unit is a chapter with a Jupyter notebook that runs the project's simulator. Where a unit's figure differs from the proposal's, the proposal and Figure 2 govern.", "coming": []}, "design": {"intro": "SLANT is drawn to the part level, and a prototype is built, all but its optics train. A machine shop has quoted the nine housing drawings, the two-plate slit is drawn for quote, and the optics, carrier board and harness sit inside the housing in one model checked for interference.", "claims_title": "Claims", "claims_note": "From the proposal's Resource needs section.", "claims": [["SLANT is a 1U-class unit with no mechanism, pointing service, radio, battery, pressure vessel or high voltage.", ["D_3D", "D_TT"], "design"], ["Size and mass: 103 × 103 × 107 mm (1.1 L); 665 g with camera and filters (CAD model). Four M3 screws on a 66 mm square; conductive base.", ["D_3D", "D_SET", "D_H01", "E_PWR"], "modeled"], ["The unit faces the wake, away from the atomic-oxygen flux, to record sunsets.", ["C_RATE"], "design"], ["The field of view, ±40° in elevation by ±44° cross-track, must be free of obstructions and reflectors. The boresight points 5.3° below the local horizontal to within ±24.7° in elevation.", ["D_SP", "D_H02", "S_p4"], "design"], ["Thermal: baseplate −20 to +50 °C for survival and +20 °C or colder while acquiring; the detector is uncooled.", ["~Thermal analysis, forward work after award; it decides whether the retained cooler can be removed"], "design"], ["Contamination: low-outgassing materials; parts baked at 100 °C; the assembled unit baked at +55 °C with the filter cartridge out, filters fitted in a clean room; a ground-only aperture cover; a warm detector early in orbit.", ["D_CCP"], "planned"], ["Launch random vibration to GEVS qualification level, shock per the launch provider, and ascent depressurization at up to 4.5 kPa/s.", ["D_H09", "D_R4"], "design"]], "sections": [{"title": "Prototype", "note": "Built and assembled at Carthage. The optics train, the slit plate and filter films, goes in next.", "ids": ["D_P1", "D_P2", "D_P3"]}, {"title": "Inside the unit", "note": "The camera in these models carries the thermoelectric cooler, retained until the thermal analysis after award, which may rule it out.", "ids": ["D_3D", "D_TT", "D_R1", "D_R2", "D_R3", "D_R4"]}, {"title": "Housing drawings", "kind": "sheets", "note": "Each drawing comes with its part's STEP file; the housing's model mass is 393.7 g.", "ids": ["D_SET", "D_H01", "D_H02", "D_H03", "D_H04", "D_H05", "D_H06", "D_H07", "D_H08", "D_H09"]}, {"title": "Assembly", "ids": ["D_ASM"]}, {"title": "Slit plate", "ids": ["D_SP", "D_SP2"]}, {"title": "Plans", "ids": ["D_CCP"]}], "coming": []}, "electronics": {"intro": "SLANT's readout computer is a Raspberry Pi Compute Module 5 on a carrier board Carthage designed. The board isolates the host's unregulated bus, powers the computer and camera head through switches it can measure and turn off, and talks to the host over CAN or RS-422.", "claims_title": "Claims", "claims_note": "From the proposal's Resource needs and Solution development plan sections.", "claims": [["Power (datasheet estimate): isolated 9 to 36 V input; 5.7 to 9.7 W while acquiring; off between passes; 0.33 to 0.55 W orbit average.", ["E_PWR"], "estimate", "Resource needs"], ["Data: 7.2 MB per day over CAN 2.0B or RS-422.", ["C_RATE"], "modeled", "Resource needs"], ["The host switches power on at a time SLANT reports, a minute before the Sun reaches 10° above the local horizontal, and supplies a one-pulse-per-second signal and UTC to 10 ms, position to 100 m, and attitude to 0.5°.", ["E_PWR"], "design", "Resource needs"], ["Total dose 3 krad(Si) per year, pending an AE9/AP9 run for the host.", ["~AE9/AP9 run for the host orbit, forward work after award"], "planned", "Resource needs"], ["EMI/EMC: isolated input; flight unit tested at JSC.", ["T_CAL"], "planned", "Resource needs"], ["The CM5 runs only during passes, about 80 minutes a day, with error-correcting memory.", ["E_PWR", "@Raspberry Pi CM5 product page: memory with ECC|https://www.raspberrypi.com/products/compute-module-5/"], "design", "Solution development plan"], ["Operations: a 64 s watchdog restarts a hung computer; the host can cycle power. Ten commissioning passes check dark, leak and reference frames.", [], "design", "Flight demonstration and integration"], ["A day's 7.2 MB needs one minute of 1 Mbit/s S-band downlink. On-board storage holds at least 14 days, so a missed contact loses no data.", ["C_RATE"], "design", "Flight demonstration and integration"], ["The flight unit needs the Carthage-designed CM5 carrier board and camera software.", [], "planned", "Solution development plan"]], "sections": [{"title": "Budget", "ids": ["E_PWR"]}], "coming": []}, "testing": {"intro": "A visible-light bench at Carthage reproduces the flight optics; on it the ratio method has met targets set before the test, and every slit plate's angular response is scanned. NIST SURF III measures the engineering unit's ultraviolet response. The flight unit is tested for vibration, shock and EMI/EMC at JSC and in thermal vacuum at UW-Madison.", "claims_title": "Claims", "claims_note": "From the proposal's Technology development status, Technology performance, Solution development plan and Project plan sections.", "claims": [["A visible-light bench matches the flight ratio of solar-image blur to slit width (1.86) and the diffraction regime of the far-ultraviolet channels.", ["T_MATCH", "T_BENCH"], "built", "Technology development status"], ["A graded neutral-density filter stands in for the atmosphere. As in flight, each reading is divided by a same-slit reference, giving optical depth. Across nine calibrated optical depths from 0.6 to 2.25, the largest error was 0.0096, against a 0.02 limit set before the test.", ["T_A5", "T_TESTS"], "measured", "Technology development status"], ["Bench scans measure each assembly's angular response to 0.27%, holding the oxygen bias within 3.3%.", ["T_CAL"], "planned", "Technology performance"], ["NIST SURF III measures the engineering unit's 5–175 nm response against the retrieval's model, and indium's out-of-band transmission to ±2%; flight films share that Luxel run.", ["T_CAL", "P_REQ"], "planned", "Technology performance"], ["Risks (likelihood, consequence; trigger: response). Indium launch survival (medium, high; film damaged in the months 1–2 launch test: sealed cover).", ["T_CAL"], "planned", "Solution development plan"], ["Slit fabrication (low, medium; no trial plate within the 25 ± 2.5 µm width by month 2: second round from the best vendor).", ["T_CAL", "D_SP"], "planned", "Solution development plan"], ["SURF III access (low, high; no beam time by month 3: LASP).", ["T_CAL"], "planned", "Solution development plan"], ["Indium aging (high, low; about 30% throughput loss in a year cancels in the same-pass ratio and raises photon noise about 20%).", [], "modeled", "Solution development plan"], ["Far-ultraviolet leak (medium, medium; leak measured below 105 km exceeds budget: third filter).", ["P_REQ"], "design", "Solution development plan"], ["Months 1–2: Order the engineering camera, films and far-ultraviolet filters; request SURF III, JSC and UW-Madison test time. Three vendors make trial slit plates. Acoustic- and vibration-test an indium witness film. Set far-ultraviolet stack depth from vendor curves. Write the test matrix. Milestone: slit plate selected; camera running.", ["T_CAL"], "planned", "Project plan"], ["Months 3–4: Scan the bare plate's angular response; Luxel then bonds the films. Prove the sensing technology at SURF III: measure the engineering unit's 5–175 nm response against the retrieval's model, and recover a calibrated witness filter's optical depth within 0.02 in each EUV band. Thermal-vacuum-test the engineering unit at Carthage, measuring detector heating.", ["T_CAL", "T_TESTS"], "planned", "Project plan"], ["Months 5–6: Build the flight unit by the same steps without a SURF III session, because Luxel makes both units' films in one production run. Verify the host interface and ground pipeline.", ["T_CAL"], "planned", "Project plan"], ["Months 7–8: EMI/EMC, protoflight vibration and shock at JSC; bakeout without filters, then protoflight thermal vacuum at UW-Madison. Month 8 holds a two-week retest window. Write the operational validation plan.", ["T_CAL"], "planned", "Project plan"], ["Schedule risk: six-week camera lead; flight camera ordered in month 4.", [], "planned", "Project plan"]], "sections": [{"title": "The bench", "ids": ["T_BENCH", "T_MATCH", "T_DRAW", "T_TESTS", "T_A5", "S_p3"]}, {"title": "Flight units", "ids": ["T_CAL"]}], "coming": []}, "cost": {"intro": "The cost case rests on a short parts list: a commercial camera, foil filters on one slit plate, a machined housing and a small computer board, with no mechanism, lens or high voltage. The scaling case rests on a computed network: how often each unit measures, where and when, and how units calibrate one another in flight.", "claims_title": "Claims", "claims_note": "From the proposal's Projected cost and scalability section.", "claims": [["The flight unit this award builds costs about $72,600, excluding non-recurring engineering: $71,600 in parts and 40 hours of assembly at $25 an hour. That is 14 times below the $1 million low end that the challenge's technical guidelines give for comparable instruments.", ["C_COST", "@Orbital Clarity technical guidelines|https://occ.nasatechleap.org/technical-guidelines/"], "estimate"], ["The XIMEA camera is 64% of parts ($40,000 quoted plus a $6,000 cooler allowance); the filters are 17% (foils quoted, far-ultraviolet filters estimated).", ["C_COST"], "estimate"], ["At 100 units the recurring cost is at most $54,100, 18 times below $1 million: camera $38,000, filters $10,045, other parts $4,316, assembly $1,000, acceptance test $743.", ["C_COST"], "estimate"], ["XIMEA quotes 20% off the camera at 100; the cooler is undiscounted. Luxel's lab-grade price at 10 ($4,045 per foil set) is applied at 100; flight grade is unpriced. Far-ultraviolet filters stay at single-unit prices.", ["C_COST"], "estimate"], ["Each reading is divided by a reference through the same slit and filter, so detector gain and filter transmission cancel and no unit needs an absolute intensity calibration.", ["M01", "M04", "S_p3"], "design"], ["The optics are one slit plate 5.0 mm in front of the detector, with no lens, telescope or grating. A 1.25-hour lab scan measures each assembly's angular response, so no precision alignment step is needed.", ["D_SP", "D_R4", "T_CAL"], "design"], ["There is no mechanism, consumable or high voltage; the host is a catalog Raspberry Pi Compute Module 5.", ["D_3D"], "design"], ["Luxel makes the carrier plate and bonds our slit sheet and three foils to it; Carthage clamps the four far-ultraviolet filters, two stacked on each channel, and assembles.", ["D_SP", "S_p5"], "design"], ["At 40 hours per unit, 100 units take 25 technician-months.", ["S_p5"], "estimate"], ["Acceptance test is the angular scan plus one NIST SURF III calibration, about $14,200 with travel, per 20-unit lot.", ["C_COST", "T_CAL"], "estimate"], ["Alternate sources exist for the camera (Andor) and the foils (Lebow), neither yet qualified.", [], "background"], ["The unit mounts on a fixed bracket on any three-axis-stabilized host at 350 km or higher outside dawn-dusk sun-synchronous orbits, runs from a 9–36 V bus, and needs no radio, GNSS receiver or license.", ["S_p4", "D_H01"], "design"], ["A hundred units return about 1,000 profiles daily.", ["C_RATE"], "modeled"], ["Over a simulated year on a 53° host, a unit records occultations on 75–82% of days. Its tangent points span 66° S to 66° N, in a narrower band each month.", ["C_RATE", "S_p5"], "modeled", "Other considerations"], ["If at most 1% of each unit's offset variance is shared, the between-unit error of the hundred-unit mean is 0.32%, against 2.3% for one unit.", ["C_AVG", "C_NET", "S_p5"], "modeled"]], "sections": [{"title": "Cost", "kind": "table", "ids": ["C_COST"]}, {"title": "Network", "ids": ["C_RATE", "C_NET", "C_AVG", "S_p5"]}, {"title": "Host accommodation", "ids": ["S_p4"]}], "coming": []}, "team": {"intro": "SLANT is built at Carthage College by a team that has flown hardware on parabolic aircraft, suborbital vehicles, sounding rockets, CubeSats and the ISS. The method it uses, reading the thermosphere from the sunlight it absorbs at sunset, has a published record that begins in the 1970s.", "claims_title": "Claims", "claims_note": "From the proposal's Capabilities section.", "claims": [["Carthage College, the lead organization, holds the prize funds; Kevin Crosby, lead scientist, directs the work.", ["T_TEAM"], "background"], ["The Carthage space sciences program he directs has flown 22 parabolic-flight campaigns, two ISS experiments, six suborbital and five sounding-rocket payloads and two CubeSat missions, and has a lunar instrument on Intuitive Machines IM-3, all sponsored, many by NASA Flight Opportunities, all on budget.", ["H_REC", "H_UPI", "H_CANOP"], "background"], ["One, a NASA TechLeap award run in this challenge's phases, met every gate on schedule and awaits flight.", ["H_MUTT"], "built"], ["SLANT work to date: a simulator tested in eight model atmospheres; a visible-light bench recovering optical depths 0.6–2.25 within 0.01; slit-plate drawings, a built prototype housing and a carrier-board layout.", ["M02", "T_BENCH", "T_A5", "D_SP", "D_P1"], "measured"], ["Crosby and students design the slit plate, assemble and calibrate each unit, and write flight software.", ["T_TEAM"], "background"], ["Carthage graduate Semaje Farmer is the electronics and systems engineer.", ["T_TEAM"], "background"], ["Fred Best (UW–Madison SSEC), consultant, brings radiometric calibration for NIST SURF III, thermal design and the thermal-vacuum test at UW–Madison, and long experience qualifying space instruments.", ["T_TEAM", "T_CAL"], "background"], ["XIMEA supplies the camera and Linux driver; Luxel supplies the metal foils.", ["T_TEAM", "C_COST"], "background"], ["Vibration, shock and EMI/EMC tests are at Johnson Space Center's EA branch, which this team used twice.", ["T_CAL", "H_REC"], "planned"], ["Carthage facilities: optics laboratory; laminar-flow clean area; vacuum chamber, used on flight hardware, that fits the engineering unit; electronics laboratory; CNC; additive manufacturing; machine shop.", ["T_BENCH"], "background"], ["Laura Tomlin, project manager, handles schedule, budget, vendor contracts and project data.", ["T_TEAM"], "background"], ["Three students work under Crosby and Best. When a student graduates, a new student takes over the role.", ["T_TEAM", "T_PHOTO"], "background"]], "sections": [{"title": "The team", "ids": ["T_TEAM", "T_PHOTO"]}, {"title": "Flight hardware", "ids": ["H_REC", "H_UPI", "H_CANOP", "H_MUTT"]}, {"title": "Heritage", "ids": ["H_OCC", "H_COMP"]}], "coming": []}}, "placeholders": {}, "items": {"S_p1": {"title": "Page 1: how SLANT measures thermospheric composition", "basis": "modeled", "date": "2026-11-04", "short": "Page 1: how SLANT measures thermospheric composition", "files": [{"label": "PDF, page 1", "href": "files/S_p1/SLANT-Visual-p1-2026-11-04.pdf", "size": "109 kB"}, {"label": "PDF, all five pages", "href": "files/S_p1/SLANT-Visual-PDF-2026-11-04.pdf", "size": "906 kB"}], "preview": "prev/S_p1.jpg"}, "S_p2": {"title": "Page 2: modeled mass-density and temperature performance", "basis": "modeled", "date": "2026-11-04", "short": "Page 2: modeled mass-density and temperature performance", "files": [{"label": "PDF, page 2", "href": "files/S_p2/SLANT-Visual-p2-2026-11-04.pdf", "size": "62 kB"}], "preview": "prev/S_p2.jpg"}, "S_p3": {"title": "Page 3: component evidence and the calibration plan", "basis": "design", "date": "2026-11-04", "short": "Page 3", "files": [{"label": "PDF, page 3", "href": "files/S_p3/SLANT-Visual-p3-2026-11-04.pdf", "size": "350 kB"}], "preview": "prev/S_p3.jpg"}, "S_p4": {"title": "Page 4: the payload and how it fits a host", "summary": "The unit with its modeled mass and its mass and power allocations, the cone the Sun must cross, the signal path to the host, what the host supplies and what we deliver, and the flight heritage of Carthage's payloads.", "basis": "design", "date": "2026-11-04", "short": "Page 4", "files": [{"label": "PDF, page 4", "href": "files/S_p4/SLANT-Visual-p4-2026-11-04.pdf", "size": "385 kB"}], "preview": "prev/S_p4.jpg"}, "S_p5": {"title": "Page 5: production and network coverage", "summary": "The production flow, with supplier steps done once per lot; one simulated day of occultations for 6, 30 and 100 units; and how the error of a network mean falls as occultations and units are averaged.", "basis": "modeled", "date": "2026-11-04", "short": "Page 5", "files": [{"label": "PDF, page 5", "href": "files/S_p5/SLANT-Visual-p5-2026-11-04.pdf", "size": "157 kB"}], "preview": "prev/S_p5.jpg"}, "M01": {"title": "Figure 1: how SLANT measures thermospheric composition", "summary": "Occultation geometry, the five filtered slits imaging the Sun onto one detector, transmission against tangent altitude, slant columns of O, N₂ and O₂ at 250 km, and the derived density and temperature profiles.", "note": "Quiet NRLMSIS 2.1 atmosphere. Zr and In use Luxel's measured filter curves; Al and the two far-ultraviolet channels are modeled bands.", "basis": "modeled", "date": "2026-11-04", "short": "Figure 1", "files": [{"label": "PDF", "href": "files/S_p1/SLANT-Visual-p1-2026-11-04.pdf", "size": "109 kB"}], "preview": "prev/M01.jpg"}, "M02": {"title": "Figure 2: modeled performance of one unit in one occultation", "summary": "Mass-density random error, vertical resolution with a thin-layer test, horizontal resolution, temperature across eight test atmospheres, and the comparison with the remote-sensing benchmark, quiet (ap 4) and in a severe storm (ap 400).", "note": "Five channels, 500 km host. The retrieval's first guess is NRLMSIS deliberately set wrong by its stated error (45 % in O and N₂, 60 % in O₂). Circles in (b) are widths measured by retrieving a thin added layer.", "basis": "modeled", "date": "2026-11-04", "short": "Figure 2", "files": [{"label": "PDF", "href": "files/S_p2/SLANT-Visual-p2-2026-11-04.pdf", "size": "62 kB"}], "preview": "prev/M02.jpg"}, "M03": {"title": "Modeling chain", "summary": "The chain from a known atmosphere to Figure 2's numbers, with the formula at each stage and each input tagged as measured, modeled, assumed, chosen or limited. It also lists the retrieval checks, the temperature branch and what the model leaves out.", "basis": "modeled", "date": "2026-10-01", "short": "Modeling chain", "files": [{"label": "PDF", "href": "files/M03/SLANT-Modeling-Chain-2026-10-01.pdf", "size": "215 kB"}], "preview": "prev/M03.jpg"}, "M04": {"title": "Measurement chain", "summary": "A single-frame version of the chain from sunlight to composition, drawn for presentation.", "basis": "modeled", "date": "2026-10-08", "short": "Chain figure", "files": [{"label": "SVG", "href": "files/M04/SLANT-Workflow-2026-10-08.svg", "size": "118 kB"}], "preview": "prev/M04.svg"}, "M05": {"title": "Occultation animation", "summary": "A 40-second animation. As the Sun sets behind the limb, transmission in five channels builds point by point, and the frames step through optical depth, slant columns, number density and mass density with its random error.", "basis": "modeled", "date": "2026-10-01", "short": "Occultation animation", "files": [{"label": "MP4", "href": "files/M05/SLANT-Occultation-Clip-2026-10-01-master.mp4", "size": "4.4 MB"}], "video": "files/M05/SLANT-Occultation-Clip-2026-10-01-master.mp4", "preview": "prev/M05.jpg"}, "M06": {"title": "Passband animation", "summary": "A 38-second animation of the solar flux, the absorption cross sections and the five filter passbands. It shows which species each channel sees at each tangent altitude and what the two far-ultraviolet channels add to the O₂ retrieval.", "note": "The In channel's share turns to O₂ below 174 km because 22 % of the flux the In filter admits lies at 100–122 nm, where only O₂ absorbs.", "basis": "modeled", "date": "2026-10-02", "short": "Passband animation", "files": [{"label": "MP4", "href": "files/M06/SLANT-Passband-Clip-2026-10-02-master.mp4", "size": "1.9 MB"}], "video": "files/M06/SLANT-Passband-Clip-2026-10-02-master.mp4", "preview": "prev/M06.jpg"}, "M07": {"title": "Ray-trace animation", "summary": "A 40-second ray trace. Sunlight from each part of the solar disk passes the baffle, the filters and the 25 µm × 10 µm slit waist to the detector rows, and each channel's summed signal builds up.", "note": "500 km host, Sun in the orbit plane (β = 0), quiet atmosphere. Rays are traced geometrically through the head; diffraction from slit to detector is scalar Fresnel.", "basis": "modeled", "date": "2026-10-07", "short": "Ray-trace animation", "files": [{"label": "MP4", "href": "files/M07/SLANT-Raytrace-Clip-2026-10-07-master.mp4", "size": "6.7 MB"}], "video": "files/M07/SLANT-Raytrace-Clip-2026-10-07-master.mp4", "preview": "prev/M07.jpg"}, "T_u01": {"title": "Unit 1: drag, and why density is the limiting number", "summary": "Why is a ten per cent density error worth an instrument program?", "basis": "background", "date": "2026-09-08", "short": "Unit 1", "files": [{"label": "PDF", "href": "files/T_u01/Unit-01-why-density.pdf", "size": "105 kB"}], "preview": "prev/T_u01.jpg", "pages": "7"}, "T_u02": {"title": "Unit 2: the atmosphere as a stack of regimes", "summary": "What is the thing at 90 to 300 km, and which of its properties set instrument requirements?", "basis": "background", "date": "2026-09-08", "short": "Unit 2: the atmosphere as a stack of regimes", "files": [{"label": "PDF", "href": "files/T_u02/Unit-02-atmosphere.pdf", "size": "106 kB"}], "preview": "prev/T_u02.jpg", "pages": "7"}, "T_u03": {"title": "Unit 3: how much the atmosphere moves", "summary": "What dynamic range must the instrument and the inversion survive?", "basis": "background", "date": "2026-09-08", "short": "Unit 3", "files": [{"label": "PDF", "href": "files/T_u03/Unit-03-variability.pdf", "size": "94 kB"}], "preview": "prev/T_u03.jpg", "pages": "6"}, "T_u04": {"title": "Unit 4: how a photon tells oxygen from nitrogen", "summary": "What physically separates the species, and how well is that separation known?", "basis": "background", "date": "2026-09-08", "short": "Unit 4", "files": [{"label": "PDF", "href": "files/T_u04/Unit-04-cross-sections.pdf", "size": "141 kB"}], "preview": "prev/T_u04.jpg", "pages": "9"}, "T_u05": {"title": "Unit 5: occultation geometry", "summary": "Where does the measurement happen, and over what volume?", "basis": "background", "date": "2026-09-08", "short": "Unit 5", "files": [{"label": "PDF", "href": "files/T_u05/Unit-05-geometry.pdf", "size": "135 kB"}], "preview": "prev/T_u05.jpg", "pages": "8"}, "T_u06": {"title": "Unit 6: slant column density", "summary": "What do we actually measure, and what is in it besides the atmosphere?", "basis": "background", "date": "2026-09-08", "short": "Unit 6", "files": [{"label": "PDF", "href": "files/T_u06/Unit-06-slant-columns.pdf", "size": "132 kB"}], "preview": "prev/T_u06.jpg", "pages": "9"}, "T_u07": {"title": "Unit 7: from slant columns to vertical profiles", "summary": "How do you get a profile out of a set of overlapping chords, and what does that step cost?", "basis": "background", "date": "2026-09-08", "short": "Unit 7: from slant columns to vertical profiles", "files": [{"label": "PDF", "href": "files/T_u07/Unit-07-inversion.pdf", "size": "107 kB"} ost's local horizontal", "Recorded at the start of every occultation"], ["Out-of-band leak", "measured, then subtracted", "Frames below 105 km in every occultation"], ["Host altitude", "350 km or above", "A condition on the host, stated in the proposal's Resource needs section"]]}, "table_class": "plain"}, "P_ACC": {"title": "Accuracy and the retrieval's prior", "summary": "How the accuracy figures are built: the prior the retrieval assumes, the bias found when that prior is deliberately wrong, and the calibration allowance added in quadrature.", "note": "One unit, 500 km host, Zr, Al and In channels. Bias figures come from noise-free retrievals of eight truth atmospheres.", "basis": "modeled", "date": "2026-11-01", "short": "Accuracy and the retrieval's prior", "files": [{"label": "JSON, precision runs", "href": "files/P_ACC/run_2026_09_30s.json", "size": "6 kB"}, {"label": "JSON, bias with the prior high", "href": "files/P_ACC/checkB_step1_plus.json", "size": "2 kB"}, {"label": "JSON, bias with the prior low", "href": "files/P_ACC/checkB_step1_minus.json", "size": "2 kB"}], "table": {"cols": ["Quantity", "Quiet", "Severe storm"], "rows": [["Prior: NRLMSIS 2.1, uncertainty in ln n, correlated over 10 km", "0.26", "0.27"], ["Prior offset in the bias test", "O and N₂ ×1.45 and ×0.55; O₂ ×1.60 and ×0.40", "Same"], ["Retrieval bias, 170–300 km, seven of eight atmospheres", "≤7.5 %", "≤9.8 %"], ["Calibration allowance", "2.5 %", "2.5 %"], ["Total accuracy, root-sum-square", "7.9 %", "10.1 %"], ["Raised turbopause (eighth atmosphere)", "−11 to −16 % below 182 km", ""], ["Precision at 200 km: mass density, O, N₂", "8.3 %, 12.9 %, 16.1 %", "8.7 %, 13.2 %, 18.7 %"]]}, "table_class": "plain"}, "D_H01": {"title": "SLANT-H01: base plate", "summary": "6061-T6 plate, 5/8 in stock; model mass 113 g. Host face, four M3 host screws (B1–B4) on a 66 mm square, the board-stack bosses and the underside pocket.", "basis": "design", "date": "2026-10-08", "short": "Base plate H01", "files SOT-23-5": "U8_head_rail_current_amp_TI_INA293B2IDBVR_SOT-23-5", "C48_cap_10u_25V_1206_VREF": "C48_cap_10u_25V_1206_VREF", "139_626-00314_Nut_M3_bulkhead_below_2": "139_626-00314_Nut_M3_bulkhead_below_2", "J1_mate_Harwin_G125-2042696L0_cable_housing_envelope": "J1_mate_Harwin_G125-2042696L0_cable_housing_envelope", "16_SLANT-H01_base_plate": "16_SLANT-H01_base_plate", "data_connector_leads_1": "data_connector_leads_1", "139_626-00314_Nut_M3_bulkhead_below_4": "139_626-00314_Nut_M3_bulkhead_below_4", "D3_maintenance_ESD_TI_TPD4E05U06_USON-10": "D3_maintenance_ESD_TI_TPD4E05U06_USON-10"}, "preview": "prev/D_3D.jpg"}, "D_R1": {"title": "Housing, exterior", "summary": "The closed unit from the −X side, with the power and data connectors and the maintenance port.", "basis": "design", "date": "2026-10-08", "short": "Housing, exterior", "files": [], "preview": "prev/D_R1.jpg"}, "D_R2": {"title": "Housing, exploded", "summary": "The nine machined parts, H01 to H09, labelled.", "basis": "design", "date": "2026-10-08", "short": "Housing, exploded", "files": [], "preview": "prev/D_R2.jpg"}, "D_R3": {"title": "Housing, cutaway", "summary": "Baffle cone, filter cartridge, optical bulkhead and board stack in place.", "basis": "design", "date": "2026-10-08", "short": "Cutaway render", "files": [], "preview": "prev/D_R3.jpg"}, "D_R4": {"title": "Filter cartridge section", "summary": "The baffle skirt sits inside the cartridge collar with 0.5 mm radial clearance and 2.0 mm overlap, without contact. The slit plate and films lie below, the sensor package beneath.", "basis": "design", "date": "2026-10-08", "short": "Cartridge section", "files": [], "preview": "prev/D_R4.jpg"}, "D_R5": {"title": "Top plate and baffle cone", "summary": "H02 alone, sectioned: the cone, its skirt and the aperture rim.", "basis": "design", "date": "2026-10-08", "short": "Top plate and baffle cone", "files": [{"label": "PNG", "href": "files/D_R5/top-plate-baffle.png", "size": "57 kB"}], "preview": "prev/D_R5.jpg"}, "D_SET": {"title": "Drawing set", "summary": "One PDF of the nine part drawings as quoted by a machine shop, with feature tables, inside-corner allowances, insert, finish and electrical-bonding notes.", "basis": "design", "date": "2026-10-08", "short": "Drawings, rev D", "files": [{"label": "PDF", "href": "files/D_SET/SLANT-Housing-revD-Drawings.pdf", "size": "153 kB"}], "preview": "prev/D_SET.jpg", "pages": "9"}, "D_SP": {"title": "Slit-plate assembly", "summary": "Five 25 µm slits at 3.5 mm pitch: Zr, FUV 135–155 nm, Al, FUV 155–175 nm and In. A 0.025 mm stainless slit sheet is bonded to a 0.254 mm carrier, with a shim chosen so the stack fills the cartridge's 0.50 mm pocket.", "note": "Luxel bonds the three foil filters, 200 nm Zr, Al and In, to the carrier, each with a 1.5 mm margin. The carrier openings pass light to ±40° along the slit pitch and ±45° along the slits, tolerances included.", "basis": "design", "date": "2026-10-14", "short": "Slit-plate drawings", "files": [{"label": "PDF, four sheets", "href": "files/D_SP/SLANT-Slit-Plate-revA-Drawings.pdf", "size": "23 kB"}, {"label": "STEP, assembly", "href": "files/D_SP/SLANT-SPA-assembly-revA.step", "size": "343 kB"}], "preview": "prev/D_SP.jpg", "pages": "4"}, "D_SP2": {"title": "Slit-plate carrier, SP2 rev C", "summary": "The SP2 carrier plate sheet that the Luxel quote rests on: the plate that carries the three foil filters and is bonded to the slit sheet. It replaces the SP2 sheet of the rev A set above.", "note": "The sheet carries the dimensions and tolerances the etch vendor needs to make and inspect the part. Clearance, light-path and edge checks all pass.", "basis": "design", "date": "2026-10-28", "short": "Slit-plate carrier, SP2 rev C", "files": [{"label": "PDF, drawing", "href": "files/D_SP2/SLANT-SP2-revC.pdf", "size": "6 kB"}, {"label": "DXF, photo-tool geometry", "href": "files/D_SP2/SLANT-SP2-carrier-revC.dxf", "size": "38 kB"}, {"label": "STEP", "href": "files/D_SP2/SLANT-SP2-carrier-revC.step", "size": "123 kB"}, {"label": "Checks, text", "href": "files/D_SP2/checks.txt", "size": "1 kB"}], "preview": "prev/D_SP2.jpg", "pages": "1"}, "D_TT": {"title": "Turntable video", "summary": "A 20-second turntable: the closed unit turns, the walls fade, and the baffle, sensor head and carrier board are named in turn.", "note": "The sensor head carries the thermoelectric cooler, retained until the thermal analysis after award, which may rule it out.", "basis": "design", "date": "2026-10-13", "short": "Turntable video", "files": [{"label": "MP4", "href": "files/D_TT/SLANT-1U-Turntable-20s-2026-10-13.mp4", "size": "6.0 MB"}], "video": "files/D_TT/SLANT-1U-Turntable-20s-2026-10-13.mp4", "preview": "prev/D_TT.jpg"}, "D_CCP": {"title": "Contamination control", "summary": "Plan for keeping the filters, slits and detector clean from fabrication through the first weeks in orbit. It sets low-outgassing materials to ASTM E595, a vacuum bake-out at +55 °C with the filters removed, and filter installation in a clean room.", "basis": "planned", "date": "2026-10-31", "short": "Contamination control plan", "files": [{"label": "PDF", "href": "files/D_CCP/SLANT-Contamination-Control-Plan-2026-10-31.pdf", "size": "148 kB"}]}, "D_ASM": {"title": "Prototype assembly instructions", "summary": "Twenty pages of line drawings take the prototype structure from loose parts to a closed housing in 14 steps, with each fastener and wall labelled. Corner sections show how the walls and corner angles overlap.", "note": "Drawn from the assembly model. In the prototype a 1.5 mm stand-in for the optical bulkhead carries the filter cartridge; page 20 gives it at full size, with cut and print files below. Thread-forming screws hold the corner angles in place of the flight rivets.", "basis": "design", "date": "2026-10-31", "short": "Assembly instructions", "files": [{"label": "PDF", "href": "files/D_ASM/SLANT-1U-Assembly-Instructions-2026-10-31.pdf", "size": "660 kB"}, {"label": "Bulkhead stand-in, DXF", "href": "files/D_ASM/SLANT-bulkhead-standin-2026-10-29.dxf", "size": "18 kB"}, {"label": "Bulkhead stand-in, STL", "href": "files/D_ASM/SLANT-bulkhead-standin-2026-10-29.stl", "size": "509 kB"}], "preview": "prev/D_ASM.jpg", "pages": "20"}, "D_P1": {"title": "Assembled unit", "summary": "The housing as built: machined panels joined by corner angles, the top plate with its integral baffle, and the power and data connectors and maintenance port on the −X panel.", "basis": "built", "date": "2026-10-30", "short": "Assembled unit", "files": [], "preview": "prev/D_P1.jpg"}, "D_P2": {"title": "Panel removed", "summary": "One side panel off, with the electronics stack on its standoffs below the baffle.", "basis": "built", "date": "2026-10-30", "short": "Panel removed", "files": [], "preview": "prev/D_P2.jpg"}, "D_P3": {"title": "During assembly", "summary": "A panel and one corner angle off, with the angle and its fasteners beside the unit.", "basis": "built", "date": "2026-10-30", "short": "During assembly", "files": [], "preview": "prev/D_P3.jpg"}, "E_PWR": {"title": "Power and mass estimate", "summary": "Loads at 5 V from the vendors' datasheets, converted at 85 % efficiency. The host switches the unit on a minute before each pass, while the CM5 boots, and off after it; acquisition takes about 80 minutes a day in about 10 passes.", "note": "The power figures leave the retained cooler off, because the flight baseline is uncooled. The same file gives the 665 g mass from the CAD model.", "basis": "estimate", "date": "2026-10-31", "short": "Power and mass estimate", "files": [{"label": "Python, the estimate and its sources", "href": "files/E_PWR/SLANT-Power-Mass-Estimate-2026-10-31.py", "size": "3 kB"}], "table": {"cols": ["Mode", "CM5", "Camera head", "Carrier", "Loads at 5 V", "At the host bus"], "rows": [["Acquiring, low (idle figures)", "2.00 W", "2.50 W", "0.30 W", "4.80 W", "5.65 W"], ["Acquiring, high (operating figures)", "4.50 W", "3.40 W", "0.30 W", "8.20 W", "9.65 W"], ["Between passes, power off", "off", "off", "off", "0 W", "0 W"], ["Orbit average, with ten 60 s boots", "", "", "", "", "0.33 to 0.55 W"]]}, "table_class": "plain power"}, "T_BENCH": {"title": "Photographs", "summary": "A lamp and two diffusers light a 5 mm pinhole, the bench's Sun. A stage slides it behind a graded filter, so the light dims and the image moves as a setting Sun's does, and a 100 µm slit forms the strip the camera records.", "note": "Left to right along the beam: source, filter, slit and camera.", "basis": "built", "date": "2026-10-15", "short": "Bench photographs", "files": [{"label": "PNG, three panels", "href": "files/T_BENCH/SLANT-Bench-Photo-2026-10-15.png", "size": "1.3 MB"}, {"label": "JPG, light source", "href": "files/T_BENCH/bench-1-light-source.jpg", "size": "278 kB"}, {"label": "JPG, diffusers, pinhole and filter", "href": "files/T_BENCH/bench-2-diffusers-pinhole-filter.jpg", "size": "226 kB"}, {"label": "JPG, camera and slit baffle", "href": "files/T_BENCH/bench-3-camera-slit-baffle.jpg", "size": "165 kB"}], "preview": "prev/T_BENCH.jpg"}, "T_MATCH": {"title": "Optics, flight and bench", "summary": "The shape of the strip depends on the source's blurred image relative to the slit width, and on diffraction at the slit. Placing the pinhole at the right distance matches the flight blur-to-slit ratio, and the slit's Fresnel number overlaps the far-ultraviolet channels'.", "note": "Fresnel number w²/(λz); on the bench, z is the slit-to-detector distance shortened for a source at finite distance. The bench reproduces the geometry, the multi-band readout and the reduction; NIST SURF III tests the ultraviolet response.", "basis": "design", "date": "2026-10-17", "short": "Optics match", "files": [{"label": "Python, bench layout geometry", "href": "files/T_MATCH/geometry.py", "size": "3 kB"}], "table": {"cols": ["Quantity", "Flight", "Bench"], "rows": [["Source angular size", "9.3 mrad (the Sun)", "10.6 mrad (5 mm pinhole)"], ["Slit width", "25 µm", "100 µm"], ["Slit to detector", "5.0 mm", "17.5 mm"], ["Blur ÷ slit width", "1.86", "1.86"], ["Fresnel number", "0.71–20.8", "0.74–1.02"], ["Fresnel number, far-ultraviolet channels", "0.71–0.93", "0.74–1.02"], ["Wavelength", "6–175 nm", "580–800 nm"]]}, "table_class": "plain tests"}, "T_DRAW": {"title": "Assembly drawings", "summary": "Drawn for a student building the bench on a bare table: plan and side views to scale on the 1-inch hole grid, the camera head exploded, the caliper readings that fix the slit's distance from the sensor, and what the camera should show.", "note": "Choose a drawing; drag to pan, scroll or pinch to zoom.", "basis": "design", "date": "2026-10-08", "short": "Assembly drawings", "files": [{"label": "PDF, five drawings", "href": "files/T_DRAW/SLANT-Bench-Assembly-Drawings-2026-10-08.pdf", "size": "164 kB"}], "pages": [{"label": "Plan view", "href": "files/T_DRAW/F1-plan-view.svg"}, {"label": "Side views", "href": "files/T_DRAW/F2-side-view.svg"}, {"label": "Camera head, exploded", "href": "files/T_DRAW/F3-camera-head-exploded.svg"}, {"label": "Slit distance from the sensor", "href": "files/T_DRAW/F3b-standoff-measurements.svg"}, {"label": "Expected camera view", "href": "files/T_DRAW/F6-expected-camera-view.svg"}], "page0": 0}, "T_TESTS": {"title": "Tests and targets", "summary": "Each target was fixed in the test plan before measurement, with the reasoning that sets it. Together the tests check the steps the flight retrieval rests on: the strip's shape, its position, the ratio that gives optical depth, and the separation of absorbers.", "note": "Targets from the bench test plan and the angular calibration plan.", "basis": "planned", "date": "2026-10-04", "short": "Bench tests", "files": [], "table": {"cols": ["Test", "What it shows", "Target, fixed before measurement"], "rows": [["Strip formation (A3)", "The strip's profile across detector rows matches the prediction from the slit's diffraction and the source's blur.", "Width at half maximum within 15 % of prediction; residual under 5 % of the peak"], ["Image position (A4)", "The strip's centroid holds steady. In flight the centroid registers tangent altitude.", "Within 1/20 of a detector row over 10 minutes"], ["Optical depth (A5)", "The ratio of attenuated to unattenuated signal returns the optical depth of a calibrated filter, with the detector's pixel-to-pixel response cancelled.", "Within 0.02 over optical depths 0.2 to 4, in every band"], ["Two absorbers (A6)", "Absorbers measured together are recovered from the response of each measured alone.", "A well-separated pair within 5 % of truth; a nearly parallel pair within the error predicted in advance"], ["Angular-scan rehearsal (C0)", "The scan applied to every flight assembly repeats on the bench.", "Two scans agree to 5 × 10⁻⁴ RMS; the stage returns to each angle within 0.01°"]]}, "table_class": "plain tests"}, "T_A5": {"title": "Optical depth result", "summary": "Nine calibrated optical depths from 0.6 to 2.25, each recovered on the bench as the ratio of attenuated to unattenuated signal. The largest error was 0.0096, against a limit of 0.02 fixed before the test.", "note": "Test A5 on the visible-light bench. The limit is the one in the tests and targets table.", "basis": "measured", "date": "2026-10-18", "short": "A5 result", "files": [{"label": "CSV, measured values", "href": "files/T_A5/SLANT-Bench-A5-Optical-Depth-2026-10-18.csv", "size": "408 B"}], "table_class": "plain power", "table": {"cols": ["Calibrated optical depth", "Measured error", "Limit"], "rows": [["0.60", "+0.0038", "±0.02"], ["0.80", "−0.0030", "±0.02"], ["1.01", "−0.0009", "±0.02"], ["1.22", "+0.0096", "±0.02"], ["1.42", "+0.0006", "±0.02"], ["1.63", "+0.0046", "±0.02"], ["1.84", "+0.0062", "±0.02"], ["2.04", "−0.0022", "±0.02"], ["2.25", "+0.0008", "±0.02"]]}}, "T_CAL": {"title": "Calibration and environmental tests", "summary": "The schedule follows the proposal's Project plan section; months count from the Phase 1 award. Targets for the angular scan and the ultraviolet check come from the angular calibration plan.", "note": "In orbit, every occultation also records a reference frame and leak frames. The calibration requirements table on the Measurement and performance tab gives each tolerance and how it is met.", "basis": "planned", "date": "2026-11-04", "short": "Flight-unit tests", "files": [], "table": {"cols": ["Test", "Where and when", "Units", "Target or purpose"], "rows": [["Trial slit plates", "National Aperture, Lenox Laser and Potomac Photonics; months 1–2", "One trial plate from each", "Selects the vendor by measured cross-section; width within 25 ± 2.5 µm"], ["Indium film launch test", "Months 1–2", "One Luxel indium witness film", "Acoustic and random vibration; no tear and no new pinhole in a visible-light leak check"], ["Angular scan (C1, C2)", "Carthage bench, on the bare plate and its detector before Luxel bonds the films; months 3–4 for the engineering unit, 5–6 for the flight unit", "Every slit plate, about 1.25 h each", "Two wavelengths, plate normal found by autocollimation; model fit residual 7 × 10⁻⁴ RMS or less and no angle beyond 1.5 × 10⁻³, inside the 0.27 % requirement"], ["Ultraviolet response and witness filter (C3)", "NIST SURF III, beam time requested at award, LASP as alternate; months 3–4", "Engineering unit; the flight unit's films come from the same Luxel run", "5 to 175 nm at three angles against the retrieval's model; indium out-of-band transmission to ±2 %, zirconium in-band to ±1.5 %, angular response within 8.9 × 10⁻⁴; a calibrated witness filter's optical depth recovered within 0.02 in each EUV band"], ["Engineering-unit thermal vacuum", "Carthage vacuum chamber; months 3–4", "Engineering unit", "Functional test at every plateau; detector heating measured for the host baseplate limit"], ["Host interface and ground pipeline", "Carthage; months 5–6", "Flight unit", "Every interface function at 9, 28 and 36 V; data through the ground pipeline"], ["Vibration, shock and EMI/EMC", "NASA Johnson Space Center; months 7–8", "Flight unit, GEVS protoflight levels", "Launch loads and electromagnetic compatibility"], ["Bakeout and thermal vacuum", "University of Wisconsin–Madison; months 7–8", "Flight unit; bakeout with the filter cartridge out, then protoflight thermal vacuum", "Thermal survival in vacuum; functional test at every plateau"], ["Retest window", "Month 8, weeks 3–4", "Flight unit", "One failed environment repeated after repair"]]}, "table_class": "plain tests"}, "T_TEAM": {"title": "Members and roles", "summary": "Seven people: the principal investigator, a project manager, an electronics and systems engineer, three undergraduates and a consultant from UW–Madison.", "note": "XIMEA supplies the camera and Linux driver; Luxel supplies the metal foils. Vibration, shock and EMI/EMC tests are at Johnson Space Center's EA branch.", "basis": "background", "date": "2026-10-28", "short": "Members and roles", "files": [], "table": {"cols": ["Name", "Role", "Work on SLANT"], "rows": [["Kevin Crosby", "Principal investigator, Carthage College", "Directs the work; designs the slit plate with the students"], ["Laura Tomlin", "Project manager, Carthage College", "Schedule, budget, vendor contracts and project data"], ["Semaje Farmer", "Electronics and systems engineer; Carthage graduate", "Interfaces, the test matrix and operational validation plan, EMI/EMC, and soldered-assembly workmanship"], ["Owen Bonnett", "Instrument assembly and calibration; undergraduate", "Trial-plate inspection, the bare-plate angular scan, the registration record, engineering and flight unit assembly, and SURF III support"], ["Cooper Chaney", "Flight software and data; undergraduate", "Camera bring-up on the carrier board, firmware and host interface, SURF III data reduction, the operational retrieval and the radiation-dose run"], ["Maya Griffin", "Mechanical engineer, thermal and environmental test; undergraduate", "CAD and drawing release, fixtures for the Johnson Space Center tests, bakeout and thermal vacuum with Fred Best, and the detector-heating measurement"], ["Fred Best", "Consultant, UW–Madison Space Science and Engineering Center", "Thermal analysis and systems design, radiometric calibration for NIST SURF III, and the thermal-vacuum test at UW–Madison"]]}, "table_class": "plain tests"}, "T_PHOTO": {"title": "Team slide", "summary": "The seven team members with their roles.", "basis": "background", "date": "2026-10-28", "short": "Team slide", "files": [], "preview": "prev/T_PHOTO.jpg"}, "H_REC": {"title": "Flight record", "summary": "Hardware built by Kevin Crosby's teams has flown on parabolic aircraft, suborbital vehicles and sounding rockets, on CubeSats and the ISS, and is built for a lunar lander.", "note": "Every project was sponsored, many by NASA Flight Opportunities, and delivered on budget. The team has twice tested flight hardware at Johnson Space Center's EA branch.", "basis": "background", "date": "2026-10-28", "short": "Flight record", "files": [], "table": {"cols": ["Platform", "Record"], "rows": [["Parabolic flight", "22 campaigns"], ["Suborbital research flights", "6 payloads"], ["Sounding rockets", "5 payload flights"], ["CubeSats", "2 missions"], ["International Space Station", "2 experiments"], ["Moon", "An instrument for Intuitive Machines IM-3"]]}, "table_class": "plain tests"}, "H_UPI": {"title": "UPI Challenge payloads", "summary": "NASA awarded three companies in the challenge, and Carthage was selected and funded to build the common payload that flies with them on the challenge's suborbital flights. The three units stand in front.", "basis": "built", "date": "2025-04-26", "short": "UPI Challenge payloads", "files": [], "preview": "prev/H_UPI.jpg"}, "H_CANOP": {"title": "CaNOP camera", "summary": "The Canopy Near-IR Observing Program camera, with its camera interface hardware and software. Students built the engineering model.", "basis": "built", "date": "2022-03-03", "short": "CaNOP camera", "files": [], "preview": "prev/H_CANOP.jpg"}, "H_MUTT": {"title": "MUTT refueling hardware", "summary": "Double middeck-locker hardware that nucleates, migrates and traps desaturated pressurant, so a tank can vent continuously while it is refueled. The award ran in this challenge's phases, met every gate on schedule and awaits flight.", "basis": "built", "date": "2026-05-12", "short": "MUTT refueling hardware", "files": [], "preview": "prev/H_MUTT.jpg"}, "H_OCC": {"title": "Occultation record", "summary": "The published record of the method SLANT uses, from the first ultraviolet occultation measurements of the thermosphere in the 1970s to recent retrievals from PROBA2/LYRA and GOES-R/SUVI.", "basis": "background", "date": "2026-10-17", "refs": [["Roble, R. G., & Norton, R. B. (1972). Thermospheric molecular oxygen from solar extreme-ultraviolet occultation measurements. Journal of Geophysical Research, 77(19), 3524–3533.", "https://doi.org/10.1029/JA077i019p03524", "Solar extreme-ultraviolet occultation measures thermospheric composition."], ["Roble, R. G., & Hays, P. B. (1972). A technique for recovering the vertical number density profile of atmospheric gases from planetary occultation data. Planetary and Space Science, 20(10), 1727–1744.", "https://doi.org/10.1016/0032-0633(72)90194-8", "Inverting occultation slant columns into vertical density profiles, shell by shell."], ["Hays, P. B., Roble, R. G., & Shah, A. N. (1972). Terrestrial atmospheric composition from stellar occultations. In The Scientific Results from the Orbiting Astronomical Observatory (OAO-2). NASA.", "https://ntrs.nasa.gov/citations/19720024165", "Ultraviolet occultation measurements of O₂ at 100–200 km."], ["Modali, S. B., Thomas, R. W. L., Chapman, R. D., & Thomas, R. J. (1976). OSO 7 measurements of atomic oxygen and molecular nitrogen densities in the Earth's upper atmosphere. Journal of Geophysical Research, 81(34), 6203–6206.", "https://doi.org/10.1029/JA081i034p06203", "Atomic oxygen and molecular nitrogen densities from solar occultation on OSO-7."], ["Determan, J. R., Budzien, S. A., Kowalski, M. P., Lovellette, M. N., Ray, P. S., Wolff, M. T., Wood, K. S., Titarchuk, L., & Bandyopadhyay, R. (2007). Measuring atmospheric density with X-ray occultation sounding. Journal of Geophysical Research: Space Physics, 112(A6).", "https://doi.org/10.1029/2006JA012014", "Density from the broadband transmission of an occulted source."], ["Thiemann, E. M. B., Dominique, M., Pilinski, M. D., & Eparvier, F. G. (2017). Vertical thermospheric density profiles from EUV solar occultations made by PROBA2 LYRA for solar cycle 24. Space Weather, 15(12), 1649–1660.", "https://doi.org/10.1002/2017SW001719", "Density profiles across a solar cycle from a zirconium-filtered channel like SLANT's."], ["Sewell, R. H. A., Thiemann, E. M. B., Lafyatis, J., Hallock, K., Bethge, C., Pilinski, M., Sutton, E. K., Peck, C. L., & Seaton, D. B. (2025). Thermospheric density, composition, and temperature from GOES-R/SUVI solar occultations. Space Weather, 23(9), e2024SW004234.", "https://doi.org/10.1029/2024SW004234", "O, N₂, temperature and mass density from GOES-R/SUVI, with N₂ the largest term in the error budget."]], "short": "Occultation record", "files": []}, "H_COMP": {"title": "Component heritage", "summary": "Luxel foil filters fly on SDO, SOHO, PROBA2 and Solar Orbiter, and the detector type's extreme-ultraviolet response was measured at a synchrotron. The Compute Module 4, predecessor of SLANT's CM5, has flown on SatGus and VERTECS.", "note": "The CM5 itself has not flown.", "basis": "background", "date": "2026-10-17", "refs": [["Luxel Corporation. Flight heritage, 2001–2010.", "https://luxel.com/luxel-flight-heritage/flight-2001-2010/", "Filters on SDO (AIA and EVE), SOHO (EIT) and PROBA2 (SWAP)."], ["Luxel Corporation. Flight heritage, 1991–2000.", "https://luxel.com/luxel-flight-heritage/flight-1991-2000/", ""], ["Luxel Corporation (2022, 5 April). Solar Orbiter captures stunning high resolution photo of the Sun.", "https://luxel.com/solar-orbiter-photo/", "Filters on Solar Orbiter."], ["Harada, T., Teranishi, N., Watanabe, T., Zhou, Q., Bogaerts, J., & Wang, X. (2020). High-exposure-durability, high-quantum-efficiency (>90 %) backside-illuminated soft-X-ray CMOS sensor. Applied Physics Express, 13(1), 016502.", "https://doi.org/10.7567/1882-0786/ab5b5e", "Quantum efficiency above 90 % from 1.2 to 15.5 nm, measured at the NewSUBARU synchrotron."], ["Geerling, J. (2025, 8 October). How much radiation can a Pi handle in space?", "https://www.jeffgeerling.com/blog/2025/how-much-radiation-can-pi-handle-space/", "The Compute Module 4 on SatGus."], ["Fielding, E., Schulz, V. H., Chatar, K. A. A., Sano, K., & Hanazawa, A. (2024). VERTECS: A COTS-based payload interface board to enable next generation astronomical imaging payloads. Proceedings of SPIE.", "https://doi.org/10.1117/12.3019471", "The Compute Module 4 on VERTECS."]], "short": "Component heritage", "files": []}, "C_COST": {"title": "Unit cost", "summary": "How the $72,600 flight unit and the $54,100 hundred-unit ceiling are built up. At 100 units the camera and filters make up 89 % of the ceiling.", "note": "At the award quantity the SURF III session and angular scan are budgeted separately. The camera line includes a $6,000 allowance for XIMEA's thermoelectric cooler, which the design retains until the thermal analysis after award; the flight baseline is uncooled.", "basis": "estimate", "date": "2026-11-03", "short": "Cost table", "files": [], "table": {"cols": ["Line", "Flight unit", "100 units", "Basis"], "rows": [["XIMEA camera", "$46,000", "$38,000", "Quoted $40,000 plus a $6,000 cooler allowance; at 100, 20 % off the camera, cooler undiscounted"], ["Luxel Zr, Al and In films on the slit plate", "$5,855", "$4,045", "Quoted by Luxel, lab grade; the price at 10 is used at 100"], ["Far-ultraviolet filters, four per unit", "$6,000", "$6,000", "Estimate; held at 100"], ["Housing, nine machined parts", "$2,894", "$288", "Quoted by Frier at 1 and 100"], ["Interior machined parts", "$2,000", "$200", "Estimate, scaled by the housing ratio"], ["Carrier-board parts, commercial", "$219", "$219", "Catalogue price, quantity 1"], ["Flight-grade thermistors, four (added cost)", "$2,518", "$2,518", "Catalogue price, quantity 1"], ["Carrier board fabrication and assembly", "$4,000", "$250", "Estimate"], ["Raspberry Pi Compute Module 5", "$200", "$200", "Retail price"], ["Harness, connectors, fasteners", "$1,500", "$600", "Estimate"], ["Slit plate, share of a production lot", "$375", "$40", "Estimate"], ["Parts", "$71,561", "$52,361", ""], ["Fabrication and assembly, 40 h at $25/h", "$1,000", "$1,000", "Carthage rate"], ["Acceptance test", "Budgeted separately", "$743", "Angular scan, plus one SURF III session and trip per 20 units"], ["Total recurring per unit", "$72,561", "$54,103", "13.8 and 18.5 times below $1M"]]}, "table_class": "plain money"}, "C_RATE": {"title": "Occultation rate", "summary": "A year of orbits for 100 hosts with the plate's field of view applied. A wake-facing unit records 10.3 occultations a day, all at orbital sunset and most near the evening terminator; 70 % of unit-days have at least one.", "note": "On a 53° host a unit records occultations on 75–82 % of days, and its tangent points span 66° S to 66° N over the year, in a narrower band each month. Sun-synchronous hosts within about two hours of the dawn-dusk plane record none. Data total 7.2 MB a day.", "basis": "modeled", "date": "2026-10-08", "short": "Occultation rate", "files": [{"label": "PDF", "href": "files/C_RATE/SLANT-Occultation-Rate-2026-10-31.pdf", "size": "90 kB"}, {"label": "JSON, days with occultations per host", "href": "files/C_RATE/r5_cluster_days.json", "size": "15 kB"}, {"label": "JSON, tangent latitude by month, units 1–6", "href": "files/C_RATE/r5_unit_latitude.json", "size": "4 kB"}], "preview": "prev/C_RATE.jpg", "pages": "2"}, "C_AVG": {"title": "Network error scaling", "summary": "The model behind the hundred-unit figure: random error averages over occultations, each unit's offset averages over units, and the part all units share sets a floor of 0.23 %. Tables give 1 to 500 units.", "note": "If 30 % of each unit's offset is shared within each 20-unit production lot, 100 units reach 0.64 %.", "basis": "modeled", "date": "2026-10-31", "short": "Error scaling", "files": [{"label": "PDF", "href": "files/C_AVG/SLANT-Network-Averaging-2026-10-31.pdf", "size": "110 kB"}, {"label": "JSON, lot-shared case", "href": "files/C_AVG/c8_lot_shared_results.json", "size": "388 B"}], "preview": "prev/C_AVG.jpg", "pages": "3"}, "C_NET": {"title": "Network coverage and cross-calibration", "summary": "Facing units on hosts above 565 km forward raises the share of dawn events from 9 % to 31 %. Cross-calibrating a wake-facing network cuts the single-unit error from 1.13 % to 0.82 % quiet and from 2.70 % to 1.66 % in a storm.", "note": "The adjustment closes for 89 of 100 wake-facing hosts; a mixed network matches it only above about 30 units.", "basis": "modeled", "date": "2026-10-08", "short": "Network study", "files": [{"label": "PDF", "href": "files/C_NET/SLANT-Network-Orientation-2026-10-31.pdf", "size": "102 kB"}], "preview": "prev/C_NET.jpg", "pages": "3"}}, "references": {"intro": "The published sources behind the statements in our submission form and its five-page visual supplement. Under each entry, <i>Supports</i> names the statement it backs. Results from our own simulations, bench tests and design files are on the other tabs. Every link and DOI was checked on 17 October 2026.", "sections": [{"title": "The challenge", "entries": [{"n": "1", "cite": "NASA TechLeap Prize (2026). <i>Orbital Clarity Challenge: Technical guidelines.</i> <a href=\"https://occ.nasatechleap.org/technical-guidelines/\" target=\"_blank\" rel=\"noopener\">occ.nasatechleap.org/technical-guidelines/</a>", "supports": "<i>Supports:</i> the remote-sensing benchmarks (90–300 km; 10 % accuracy and precision; 10 km vertical and 5° horizontal resolution); thermospheric mass density as the lead measurand, with composition valued but not required; the per-unit cost of comparable instruments, roughly $1M–$10M; operation for at least one year in the LEO or VLEO environment; NRLMSIS as the reference model."}, {"n": "2", "cite": "NASA TechLeap Prize (2026). <i>Orbital Clarity Challenge: Evaluation criteria.</i> <a href=\"https://occ.nasatechleap.org/evaluation-criteria/\" target=\"_blank\" rel=\"noopener\">occ.nasatechleap.org/evaluation-criteria/</a>", "supports": "<i>Supports:</i> the two four-month development phases and their site visits, used in the project plan."}]}, {"title": "Solar and stellar occultation of the thermosphere", "entries": [{"n": "3", "cite": "Roble, R. G., &amp; Norton, R. B. (1972). Thermospheric molecular oxygen from solar extreme-ultraviolet occultation measurements. <i>Journal of Geophysical Research, 77</i>(19), 3524–3533. <a href=\"https://doi.org/10.1029/JA077i019p03524\" target=\"_blank\" rel=\"noopener\">doi.org/10.1029/JA077i019p03524</a>", "supports": "<i>Supports:</i> solar EUV occultation as an established method for thermospheric composition."}, {"n": "4", "cite": "Roble, R. G., &amp; Hays, P. B. (1972). A technique for recovering the vertical number density profile of atmospheric gases from planetary occultation data. <i>Planetary and Space Science, 20</i>(10), 1727–1744. <a href=\"https://doi.org/10.1016/0032-0633(72)90194-8\" target=\"_blank\" rel=\"noopener\">doi.org/10.1016/0032-0633(72)90194-8</a>", "supports": "<i>Supports:</i> inversion of occultation slant columns into vertical density profiles, including the shell-by-shell method used in our temperature retrieval."}, {"n": "5", "cite": "Hays, P. B., Roble, R. G., &amp; Shah, A. N. (1972). Terrestrial atmospheric composition from stellar occultations. In <i>The Scientific Results from the Orbiting Astronomical Observatory (OAO-2)</i>. NASA. NTRS 19720024165. <a href=\"https://ntrs.nasa.gov/citations/19720024165\" target=\"_blank\" rel=\"noopener\">ntrs.nasa.gov/citations/19720024165</a>", "supports": "<i>Supports:</i> the long record of ultraviolet occultation measurements of O₂ at 100–200 km."}, {"n": "6", "cite": "Modali, S. B., Thomas, R. W. L., Chapman, R. D., &amp; Thomas, R. J. (1976). OSO 7 measurements of atomic oxygen and molecular nitrogen densities in the Earth&#x27;s upper atmosphere. <i>Journal of Geophysical Research, 81</i>(34), 6203–6206. <a href=\"https://doi.org/10.1029/JA081i034p06203\" target=\"_blank\" rel=\"noopener\">doi.org/10.1029/JA081i034p06203</a>", "supports": "<i>Supports:</i> &quot;Solar occultation has measured thermospheric density since OSO-7.&quot;"}, {"n": "7", "cite": "Determan, J. R., Budzien, S. A., Kowalski, M. P., Lovellette, M. N., Ray, P. S., Wolff, M. T., Wood, K. S., Titarchuk, L., &amp; Bandyopadhyay, R. (2007). Measuring atmospheric density with X-ray occultation sounding. <i>Journal of Geophysical Research: Space Physics, 112</i>(A6). <a href=\"https://doi.org/10.1029/2006JA012014\" target=\"_blank\" rel=\"noopener\">doi.org/10.1029/2006JA012014</a>", "supports": "<i>Supports:</i> broadband-transmission occultation as a related, published density technique."}, {"n": "8", "cite": "Thiemann, E. M. B., Dominique, M., Pilinski, M. D., &amp; Eparvier, F. G. (2017). Vertical thermospheric density profiles from EUV solar occultations made by PROBA2 LYRA for solar cycle 24. <i>Space Weather, 15</i>(12), 1649–1660. <a href=\"https://doi.org/10.1002/2017SW001719\" target=\"_blank\" rel=\"noopener\">doi.org/10.1002/2017SW001719</a>", "supports": "<i>Supports:</i> recent solar-occultation density retrievals from PROBA2/LYRA, whose channel uses a zirconium filter like ours; Monte Carlo error estimation against NRLMSIS truth atmospheres."}, {"n": "9", "cite": "Sewell, R. H. A., Thiemann, E. M. B., Lafya   const it = D.items[id];

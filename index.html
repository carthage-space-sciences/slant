  if (Array.isArray(it.pages)) return pagerBody(id, it);
  if (it.table) return tableBody(id, it);
  return `${figure(id, it)}${texts(it)}${refList(it)}${fileList(it)}`;
}
function row(id) {
  const it = D.items[id];
  return `<details class="row" id="${esc(id)}"><summary><span class="row-title">${esc(it.title)}</span><span class="row-meta small">${meta(it)}</span></summary>
    <div class="row-body">${rowBody(id)}</div></details>`;
}
function section(title, ids, note) {
  const ctl = ids.length > 1 ? `<span class="ctl"><button class="textbtn" type="button" data-all="open">Expand all</button><span>|</span><button class="textbtn" type="button" data-all="close">Collapse all</button></span>` : "";
  return `<div class="sec"><div class="sec-head"><h2 class="label">${esc(title)}</h2>${ctl}</div>${note ? `<p class="small prose">${esc(note)}</p>` : ""}<div class="rows">${ids.map(row).join("")}</div></div>`;
}

function claimList(tab, body) {
  const items = body.claims.map(c => {
    const ev = c[1].map(e => e.startsWith("~") ? (/in preparation|after award/i.test(e) ? esc(e.slice(1)) : `${esc(e.slice(1))} (in preparation)`)
      : e.startsWith("@") ? `<a href="${esc(e.split("|")[1])}" target="_blank" rel="noopener">${esc(e.slice(1).split("|")[0])}</a>`
      : `<a href="#${esc(e)}">${esc(D.items[e].short)}</a>`).join(", ");
    const tail = [basisWord(c[2]), c[3] ? `From ${c[3]}` : ""].filter(Boolean).map(esc).join(" · ");
    return `<li><p class="claim-text">${esc(c[0])}</p><p class="claim-meta small">${ev ? `Evidence: ${ev} · ` : ""}${tail}</p></li>`;
  }).join("");
  return `<div class="band"><h2 class="label">${esc(body.claims_title || `What the ${tab.box} box claims`)}</h2>
    <p class="small prose">${esc(body.claims_note)}</p><ol class="claims">${items}</ol></div>`;
}
function pageHead(tab, intro) {
  return `<div class="page-head"><h1>${esc(tab.label)}</h1>${tab.question ? `<p class="question prose">${esc(tab.question)}</p>` : ""}
    ${intro ? `<p class="intro prose">${esc(intro)}</p>` : ""}${tab.box ? `<p class="small">From the proposal: ${esc(tab.box)}</p>` : ""}</div>`;
}
function coming(list, label) {
  if (!list || !list.length) return "";
  return `<div class="sec"><div class="sec-head"><h2 class="label">${esc(label || "Still to come")}</h2></div>
    <ul class="plainlist prose">${list.map(c => Array.isArray(c) ? `<li>${esc(c[0])}, ${esc(c[1])}</li>` : `<li>${esc(c)}</li>`).join("")}</ul></div>`;
}

function renderStart() {
  const s = D.start;
  const index = D.tabs.filter(t => t.id !== "start").map(t =>
    `<li><a href="#${esc(t.id)}">${esc(t.label)}</a><span>${esc(t.question)}</span></li>`).join("");
  const strip = s.visual.map(id => { const it = D.items[id];
    return `<figure id="${esc(id)}"><button type="button" data-zoom="${esc(id)}" aria-label="Enlarge ${esc(it.title)}"><img src="${esc(it.preview)}" alt="${esc(it.title)}" loading="lazy"></button><figcaption class="small">${esc(it.title)}</figcaption></figure>`; }).join("");
  const key = D.basis.map(b => `<dt>${esc(b[1])}</dt><dd>${esc(b[2])}</dd>`).join("");
  return `<section class="tab" data-id="start">
    <div class="page-head"><h1>Start here</h1><p class="lead prose">${esc(s.lead)}</p><p class="prose">${esc(s.purpose)}</p></div>
    <div class="band"><h2 class="label">The tabs</h2><ol class="index">${index}</ol></div>
    <div class="sec"><div class="sec-head"><h2 class="label">Reading the site</h2></div><ul class="plainlist prose">${s.how.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>
    <div class="sec"><div class="sec-head"><h2 class="label">Basis</h2></div><dl class="key">${key}</dl></div>
    <div class="sec"><div class="sec-head"><h2 class="label">Visual representation</h2></div>
      ${s.visual_note ? `<p class="small prose">${esc(s.visual_note)}</p>` : ""}<div class="strip">${strip}</div></div>
    <div class="sec"><div class="sec-head"><h2 class="label">Archive and licenses</h2></div>
      <p class="prose">Archive DOI ${esc(D.meta.doi)}. Documents and figures are licensed CC BY 4.0, code MIT, and hardware design files CERN-OHL-P-2.0.</p></div>
  </section>`;
}
function renderBody(tab) {
  const b = D.bodies[tab.id];
  const secs = b.sections.map(sec => section(sec.title, sec.ids, sec.note)).join("");
  return `<section class="tab" data-id="${tab.id}">${pageHead(tab, b.intro)}${claimList(tab, b)}${secs}${coming(b.coming)}</section>`;
}
function renderRefs(tab) {
  const R = D.references;
  const secs = R.sections.map(s => `<div class="sec"><div class="sec-head"><h2 class="label">${esc(s.title)}</h2></div>
    <ol class="refs reflist">${s.entries.map(e => `<li id="ref-${esc(e.n)}"><span class="rn">${esc(e.n)}</span><div>${e.cite}${e.supports ? `<span class="what">${e.supports}</span>` : ""}</div></li>`).join("")}</ol></div>`).join("");
  return `<section class="tab" data-id="${tab.id}">${pageHead(tab, "")}<p class="prose">${R.intro}</p>${secs}</section>`;
}
function renderPlaceholder(tab) {
  return `<section class="tab" data-id="${tab.id}">${pageHead(tab, "")}${coming(D.placeholders[tab.id] || [], "In preparation")}</section>`;
}

/* page viewer: pan and zoom one page at a time */
function initPager(root) {
  const stage = root.querySelector(".pv-stage"), img = stage.querySelector("img");
  let s = 1, x = 0, y = 0, fitS = 1;
  const apply = () => { img.style.transform = `translate(${x}px, ${y}px) scale(${s})`; };
  const fit = () => {
    const W = stage.clientWidth, H = stage.clientHeight; if (!W) return;
    const w = img.naturalWidth || 1190, h = img.naturalHeight || 842;
    img.style.width = w + "px"; img.style.height = h + "px";
    fitS = Math.min(W / w, H / h); s = fitS; x = (W - w * s) / 2; y = (H - h * s) / 2; apply();
  };
  const zoomAt = (f, cx, cy) => { const ns = Math.max(fitS * 0.8, Math.min(fitS * 14, s * f)); x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply(); };
  img.addEventListener("load", fit); if (img.complete) fit();
  new ResizeObserver(() => fit()).observe(stage);
  stage.addEventListener("wheel", e => { e.preventDefault(); const b = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - b.left, e.clientY - b.top); }, {passive: false});
  const pts = new Map(); let last = null, pinch = null;
  stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); stage.classList.add("drag"); last = [e.clientX, e.clientY]; pinch = null; });
  stage.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = stage.getBoundingClientRect();
      if (pinch) zoomAt(d / pinch, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top); pinch = d; return; }
    x += e.clientX - last[0]; y += e.clientY - last[1]; last = [e.clientX, e.clientY]; apply();
  });
  const up = e => { pts.delete(e.pointerId); if (!pts.size) stage.classList.remove("drag"); pinch = null; const v = [...pts.values()][0]; if (v) last = v; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  root.addEventListener("click", e => {
    const z = e.target.closest("[data-pz]");
    if (z) { const W = stage.clientWidth / 2, H = stage.clientHeight / 2; if (z.dataset.pz === "fit") fit(); else zoomAt(z.dataset.pz === "in" ? 1.5 : 1 / 1.5, W, H); return; }
    const p = e.target.closest("[data-pv]");
    if (p) { const it = D.items[root.dataset.pvid], pg = it.pages[+p.dataset.pv];
      root.querySelectorAll("[data-pv]").forEach(b => b.setAttribute("aria-pressed", b === p ? "true" : "false"));
      img.alt = pg.label; img.src = pg.href; }
  });
}
function initTable(root) {
  const T = D.items[root.dataset.tbl].table, body = root.querySelector("tbody"), q = root.querySelector("input"), n = root.querySelector(".tbl-count");
  const qty = T.cols.indexOf("Qty"), fp = T.cols.indexOf("Footprint");
  const draw = () => {
    const k = q.value.trim().toLowerCase();
    const rows = T.rows.filter(r => !k || r.join(" ").toLowerCase().includes(k));
    body.innerHTML = rows.map(r => `<tr>${r.map((c, i) => `<td class="c${i}"${i === fp ? ` title="${esc(c)}"` : ""}>${esc(i === fp ? c.replace(/^[^:]*:/, "") : c.replace(/,(?=\S)/g, ", "))}</td>`).join("")}</tr>`).join("");
    const parts = qty >= 0 ? rows.reduce((a, r) => a + (+r[qty] || 0), 0) : rows.length;
    n.textContent = `${rows.length} lines, ${parts} parts`;
    postHeight();
  };
  q.addEventListener("input", draw); draw();
}

/* 3D view: three.js r147 (UMD builds), loaded only when the reader asks for the model */
const THREE_URLS = ["https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js",
  "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js",
  "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"];
const HIDEABLE = /^16_SLANT-H0[2-8]|^16_blind_rivets|^16_panel_screws/;
let V = null;
function loadScript(u) { return new Promise((ok, bad) => { if (document.querySelector(`script[src="${u}"]`)) return ok(); const e = document.createElement("script"); e.src = u; e.onload = ok; e.onerror = () => bad(new Error("could not load " + u)); document.head.appendChild(e); }); }
function partName(n) { return n.replace(/^(16|139)_/, "").replace(/_\d+$/, "").replace(/_/g, " ").replace(/\s+/g, " ").trim(); }
async function startViewer(id) {
  const it = D.items[id], stage = $("#stage"), btn = $("#v-load");
  btn.disabled = true; btn.textContent = "Loading the 3D model";
  try { for (const u of THREE_URLS) await loadScript(u); } catch (e) { btn.textContent = "The 3D library did not load"; return; }
  const T = window.THREE;
  const renderer = new T.WebGLRenderer({antialias: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  const scene = new T.Scene(); scene.background = new T.Color(0xFFFFFF);
  scene.add(new T.HemisphereLight(0xFFFFFF, 0x8A93A0, 1.25));
  const key = new T.DirectionalLight(0xFFFFFF, 1.3); key.position.set(1, 1.6, 1.2); scene.add(key);
  const fill = new T.DirectionalLight(0xFFFFFF, 0.55); fill.position.set(-1.2, 0.4, -0.8); scene.add(fill);
  const cam = new T.PerspectiveCamera(32, 4 / 3, 0.001, 10);
  const status = document.createElement("div"); status.className = "status"; status.textContent = "Loading model"; stage.appendChild(status);
  const onModel = gltf => {
    const root = gltf.scene; scene.add(root);
    const hideable = [];
    root.traverse(o => { if (o.isMesh) { o.material.side = T.DoubleSide; if (HIDEABLE.test(o.name) || (o.parent && HIDEABLE.test(o.parent.name))) hideable.push(o); } });
    const box = new T.Box3().setFromObject(root), c = box.getCenter(new T.Vector3()), r = box.getSize(new T.Vector3()).length() / 2;
    stage.querySelectorAll(".poster").forEach(e => e.remove());
    stage.appendChild(renderer.domElement);
    const ctl = new T.OrbitControls(cam, renderer.domElement); ctl.enableDamping = true; ctl.minDistance = r * 0.4; ctl.maxDistance = r * 8;
    const home = () => { cam.position.copy(c).add(new T.Vector3(-1.35, 0.95, 1.55).normalize().multiplyScalar(r * 3.2)); ctl.target.copy(c); ctl.update(); };
    home();
    const picked = document.createElement("div"); picked.className = "picked"; picked.textContent = "Select a part to name it"; stage.appendChild(picked);
    status.remove(); btn.textContent = "3D model loaded";
    const size = () => { const w = stage.clientWidth, h = stage.clientHeight; if (!w) return; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); };
    size(); new ResizeObserver(size).observe(stage);
    const ray = new T.Raycaster(); let down = null;
    renderer.domElement.addEventListener("pointerdown", e => { down = [e.clientX, e.clientY]; });
    renderer.domElement.addEventListener("pointerup", e => {
      if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
      const b = renderer.domElement.getBoundingClientRect();
      ray.setFromCamera(new T.Vector2(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1), cam);
      const hit = ray.intersectObjects(root.children, true).find(h => h.object.visible);
      const nm = hit ? (hit.object.name || (hit.object.parent && hit.object.parent.name) || "") : "";
      picked.textContent = hit ? partName((it.names && it.names[nm]) || nm || "part") : "Select a part to name it";
    });
    const walls = $("#v-walls"), reset = $("#v-reset");
    walls.disabled = false; reset.disabled = false;
    walls.onclick = () => { const on = walls.getAttribute("aria-pressed") !== "true"; walls.setAttribute("aria-pressed", on ? "true" : "false"); walls.textContent = on ? "Show walls and top" : "Hide walls and top"; hideable.forEach(o => { o.visible = !on; }); };
    reset.onclick = home;
    V = {alive: true};
    const loop = () => { if (!V || !V.alive || !document.body.contains(renderer.domElement)) { renderer.dispose(); return; } ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop); };
    loop();
  };
  const fail = () => { status.textContent = "The model file did not load."; };
  if (it.glb.endsWith(".b64.txt")) {
    fetch(it.glb).then(r => r.text()).then(txt => {
      const bin = atob(txt.trim()), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      new T.GLTFLoader().parse(buf.buffer, "", onModel, fail);
    }).catch(fail);
  } else {
    new T.GLTFLoader().load(it.glb, onModel, ev => { if (ev.total) status.textContent = `Loading model, ${Math.round(100 * ev.loaded / ev.total)} %`; }, fail);
  }
}

function show(id, focusItem) {
  const tab = D.tabs.find(t => t.id === id) || D.tabs[0];
  const main = $("#main");
  if (V) { V.alive = false; V = null; }
  main.innerHTML = tab.id === "start" ? renderStart() : tab.id === "references" ? renderRefs(tab) : D.bodies[tab.id] ? renderBody(tab) : renderPlaceholder(tab);
  main.querySelectorAll("[data-pvid]").forEach(initPager);
  main.querySelectorAll("[data-tbl]").forEach(initTable);
  main.querySelectorAll("details.row").forEach(d => d.addEventListener("toggle", postHeight));
  document.querySelectorAll(".tablist button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab.id ? "true" : "false"));
  const active = document.querySelector(`.tablist button[data-tab="${tab.id}"]`);
  if (active) active.scrollIntoView({block: "nearest", inline: "nearest"});
  const el = focusItem && document.getElementById(focusItem);
  if (el) {
    if (el.tagName === "DETAILS") { el.open = true; el.classList.add("arrived"); setTimeout(() => el.classList.remove("arrived"), 1800); }
    el.scrollIntoView({block: "start"});
  } else {
    window.scrollTo(0, 0);
  }
  postHeight();
}
function route() {
  const h = (location.hash || "").slice(1);
  if (D.items[h]) show(TAB_OF[h] || "start", h); else show(h || "start");
}
function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; }

function zoom(id) {
  const it = D.items[id];
  $("#lbinner").innerHTML = (it.video
    ? `<video src="${esc(it.video)}" poster="${esc(it.preview)}" controls autoplay playsinline></video>`
    : `<img src="${esc(it.large || it.preview)}" alt="${esc(it.title)}">`) + `<p class="lb-cap">${esc(it.title)}</p>`;
  $("#lb").hidden = false;
  $("#lbclose").focus();
}
function unzoom() { $("#lb").hidden = true; $("#lbinner").innerHTML = ""; }

/* inside the carthage.edu iframe, tell the parent page how tall the site is */
function postHeight() {
  if (window.parent === window) return;
  try { window.parent.postMessage({type: "slant-height", height: document.documentElement.scrollHeight}, "*"); } catch (e) {}
}

function init() {
  $("#exp").textContent = D.meta.expansion;
  $("#doi").textContent = `Archive DOI ${D.meta.doi}`;
  if (D.preview) { const p = $("#notice"); p.hidden = false; p.textContent = `${D.snapshot}. ${D.preview}`.replace(/\.\s*Private preview\./, "."); }
  $("#tablist").innerHTML = D.tabs.map(t => `<button type="button" role="tab" data-tab="${esc(t.id)}" aria-selected="false">${esc(NAV[t.id] || t.label)}</button>`).join("");
  $("#foot").innerHTML = `<span>${esc(D.meta.context)}.</span>`;
  D.tabs.forEach(t => (t.items || []).forEach(i => { TAB_OF[i] = t.id; }));
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab]"); if (t) { go(t.dataset.tab); return; }
    const a = e.target.closest("[data-all]");
    if (a) { a.closest(".sec").querySelectorAll("details.row").forEach(d => { d.open = a.dataset.all === "open"; }); postHeight(); return; }
    const z = e.target.closest("[data-zoom]"); if (z) { zoom(z.dataset.zoom); return; }
    const v = e.target.closest("[data-viewer]"); if (v && !v.disabled) { startViewer(v.dataset.viewer); return; }
    if (e.target.id === "lb" || e.target.id === "lbclose") unzoom();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lb").hidden) unzoom(); });
  window.addEventListener("hashchange", route);
  window.addEventListener("resize", postHeight);
  route();
}
init();
</script>
